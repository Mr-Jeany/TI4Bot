name: Deploy Telegram Bot

on:
  push:
    branches:
      - master

env:
  BOT_IMAGE: ghcr.io/mr-jeany/ti4bot/telegram-bot
  BOT_CONTAINER_NAME: telegram-bot

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build -t "$BOT_IMAGE:latest" .
          docker tag "$BOT_IMAGE:latest" "$BOT_IMAGE:${{ github.sha }}"

      - name: Push image
        run: |
          docker push "$BOT_IMAGE:latest"
          docker push "$BOT_IMAGE:${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY_BASE64 }}" | base64 -d > ~/.ssh/private_key

          chmod 600 ~/.ssh/private_key

          ssh-keygen -lf ~/.ssh/private_key

          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose
        run: |
          ssh -i ~/.ssh/private_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ~/telegram-bot"

          scp -i ~/.ssh/private_key -P "${{ secrets.SSH_PORT }}" \
            docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/telegram-bot/docker-compose.yml"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/private_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
              cd ~/telegram-bot &&

              echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io \
                -u '${{ github.actor }}' \
                --password-stdin &&

              sudo env BOT_IMAGE='$BOT_IMAGE:latest' BOT_TOKEN='${{ secrets.BOT_TOKEN }}' docker compose pull &&

              sudo env BOT_IMAGE='$BOT_IMAGE:latest' BOT_TOKEN='${{ secrets.BOT_TOKEN }}' docker compose down --remove-orphans || true &&

              sudo env BOT_IMAGE='$BOT_IMAGE:latest' BOT_TOKEN='${{ secrets.BOT_TOKEN }}' docker compose up -d --force-recreate
            "

      - name: Prune images
        run: |
          ssh -i ~/.ssh/private_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo docker image prune -f || true"